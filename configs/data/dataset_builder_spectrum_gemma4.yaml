# Single source for PT data creation: avreymi/reasoning-spectrum-qa.
# 1000 diverse QA across 6 reasoning families (factual, commonsense, science,
# arithmetic, multihop, extractive_control). The loader assembles the full prompt
# per row (context + question + choices); answer fields are never shown to G.
# source_limit caps a single run — factual/extractive rows rarely yield reasoning
# transitions, so a modest limit avoids wasting GPU. Raise it for a full round.
round_id: spectrum-gemma4-r2
source_type: hf_dataset
source_dataset: avreymi/reasoning-spectrum-qa
source_dataset_revision: main
source_questions_path: null
source_subset: null
source_split: data
source_question_field: question
source_limit: 200
code_version: local-dev
hub_dataset_id: avreymi/reasoning-pruning-pt-spectrum-gemma4-r2
private: true

generator:
  provider: transformers
  model_id: avreymi/gemma-4-E2B-it-reasoning-pruning

decision:
  provider: gemini-json
  model_id: gemini-3.1-flash-lite
  api_key_env: GEMINI_API_KEY
  prompt_version: conservative-skip-v1

generation:
  max_new_tokens: 512
  temperature: 0.7
  do_sample: true

pruning:
  conservative: true
  require_following_step: true
  max_output_tokens: 256
  temperature: 0.0

max_pruning_depth: 3
max_examples_per_question: 1
unit_split_strategy: clauses
