[project]
name = "reasoning-pruning-codex"
version = "0.1.0"
description = "Minimal reasoning-pruning transition dataset and Gemma training harness."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.34.0",
    "datasets>=4.8.5",
    "pyyaml>=6.0.2",
    "torchvision>=0.27.0",
    "transformers>=4.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
